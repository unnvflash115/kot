<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tennis Cat 2D</title>
    <script src="https://yandex.ru/games/sdk/v2"></script>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: 100%;
            margin: 0 auto;
            overflow: hidden;
            background: #000;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }
        .ui-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            padding: 20px;
        }
        .hidden { display: none !important; }
        
        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ff9800;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .score-display {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 25px;
            text-align: center;
        }
        .score-number {
            color: #ff9800;
            font-size: 3rem;
            font-weight: 900;
            display: block;
            margin-top: 5px;
        }
        .btn {
            padding: 16px 24px;
            font-size: 1.2rem;
            font-weight: 800;
            color: white;
            background: #4caf50;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
            margin: 8px 0;
            width: 100%;
            max-width: 280px;
            transition: transform 0.1s, opacity 0.1s;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn * { pointer-events: none; }
        .btn:active { transform: scale(0.96); opacity: 0.9; }
        .btn-inventory { background: #2196f3; box-shadow: 0 4px 15px rgba(33, 150, 243, 0.4); }
        .btn-diff { background: #ff9800; box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4); }
        .btn-boss { background: #f44336; box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4); }
        
        .diff-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 280px;
        }

        .carousel-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 340px;
            margin-bottom: 20px;
        }
        .carousel-btn {
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.6rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 152, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.1s;
        }
        .carousel-btn:active { transform: scale(0.9); }
        
        .skin-card {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 190px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .skin-preview {
            width: 130px;
            height: 130px;
            object-fit: contain;
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }
        .skin-title {
            color: white;
            font-size: 1.1rem;
            font-weight: 800;
            text-align: center;
        }
        
        #hud {
            position: absolute;
            top: 25px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
            font-size: 1.6rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 4px 12px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 50;
        }

        .score-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .score-val {
            font-size: 2.2rem;
            color: #ff9800;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="main-menu" class="ui-screen">
            <h1>🐱 TENNIS CAT 🎾</h1>
            <div id="best-score-display" class="score-display" style="margin-bottom:20px; font-size:1.1rem;">
                <span data-i18n="bestScoreText">Рекорд побед:</span> <span id="best-score-value" style="color:#ff9800; font-weight:900;">0</span>
            </div>
            <button id="btn-start" class="btn" data-i18n="btnStart">ИГРАТЬ</button>
            <button id="btn-inventory" class="btn btn-inventory" data-i18n="btnInventory">ГАРДЕРОБ</button>
        </div>

        <div id="difficulty-screen" class="ui-screen hidden">
            <h1 data-i18n="difficultyTitle">СЛОЖНОСТЬ</h1>
            <div class="diff-grid">
                <button class="btn" data-diff="easy" style="background: #8bc34a;" data-i18n="diffEasy">👶 ЛЕГКО</button>
                <button class="btn" data-diff="medium" data-i18n="diffMedium">😎 СРЕДНЕ</button>
                <button class="btn" data-diff="hard" style="background: #ff9800;" data-i18n="diffHard">🔥 СЛОЖНО</button>
                <button class="btn btn-boss" data-diff="boss" data-i18n="diffBoss">😈 БОСС</button>
            </div>
            <button id="btn-diff-back" class="btn btn-inventory" data-i18n="btnBack">НАЗАД</button>
        </div>

        <div id="hud" class="hidden">
            <div class="score-box">
                <span class="score-title" data-i18n="playerTitle">ВЫ</span>
                <span id="player-score" class="score-val">0</span>
            </div>
            <div style="font-size: 2rem; color: #ff9800;">:</div>
            <div class="score-box">
                <span class="score-title" data-i18n="catTitle">КОТ</span>
                <span id="cat-score" class="score-val">0</span>
            </div>
        </div>

        <div id="win-screen" class="ui-screen hidden">
            <h1 style="color: #4caf50;" data-i18n="winTitle">🏆 ПОБЕДА!</h1>
            <div class="score-display">
                <span data-i18n="winSub">ВЫ ОБЫГРАЛИ КОТА!</span>
                <span id="win-score-text" class="score-number" style="color: #4caf50;">5 : 0</span>
            </div>
            <button id="btn-win-restart" class="btn" data-i18n="btnRestart">ЕЩЕ РАЗ</button>
            <button id="btn-next-level" class="btn btn-diff" data-i18n="btnNext">СЛЕД. УРОВЕНЬ ➔</button>
            <button id="btn-win-menu" class="btn btn-inventory" data-i18n="btnMenu">В МЕНЮ</button>
        </div>

        <div id="game-over-screen" class="ui-screen hidden">
            <h1 style="color: #f44336;" data-i18n="loseTitle">ПОРАЖЕНИЕ</h1>
            <div class="score-display">
                <span data-i18n="loseSub">КОТ ВЫИГРАЛ МАТЧ:</span>
                <span id="final-score" class="score-number">0 : 5</span>
            </div>
            <button id="btn-restart" class="btn" data-i18n="btnPlayAgain">ИГРАТЬ СНОВА</button>
            <button id="btn-gameover-diff" class="btn btn-diff" data-i18n="btnDifficulty">СЛОЖНОСТЬ</button>
            <button id="btn-gameover-inventory" class="btn btn-inventory" data-i18n="btnInventory">ГАРДЕРОБ</button>
        </div>

        <div id="inventory-screen" class="ui-screen hidden">
            <h1 data-i18n="inventoryTitle">ГАРДЕРОБ</h1>
            
            <div class="carousel-container">
                <button id="btn-prev-skin" class="carousel-btn">◄</button>
                
                <div class="skin-card">
                    <img id="skin-preview-img" class="skin-preview" src="" alt="Skin Preview">
                    <div id="skin-title-text" class="skin-title">Обычный котик</div>
                </div>
                
                <button id="btn-next-skin" class="carousel-btn">►</button>
            </div>

            <button id="btn-select-skin" class="btn">ВЫБРАТЬ</button>
            <button id="btn-back" class="btn btn-inventory" data-i18n="btnBack">НАЗАД</button>
        </div>
    </div>

    <script>

            },

                btnRestart: 'PLAY AGAIN',

                btnPlayAgain: 'PLAY AGAIN',

                skins: {

        let currentLang = 'ru';

        function updateUIWithLanguage(lang) {
            const langData = TRANSLATIONS[lang] || TRANSLATIONS['en'];
            currentLang = lang;

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (langData[key]) {
                    el.innerText = langData[key];
                }
            });

            skins.forEach(s => {
                if (langData.skins && langData.skins[s.id]) {
                    s.title = langData.skins[s.id];
                }
            });

            updateCarousel();
        }

        let ysdkInstance = null;
        let pendingAssets = 0;
        let assetsAreReady = false;

        function reportGameReadyIfPossible() {
            if (assetsAreReady && ysdkInstance) {
                ysdkInstance.features.LoadingAPI?.ready();
            }
        }

        if (typeof YaGames !== 'undefined') {
            YaGames.init().then(ysdk => {
                window.ysdk = ysdk;
                ysdkInstance = ysdk;

                if (ysdk.environment && ysdk.environment.i18n && ysdk.environment.i18n.lang) {
                    updateUIWithLanguage(ysdk.environment.i18n.lang);
                } else {
                    updateUIWithLanguage('ru');
                }

                reportGameReadyIfPossible();
            }).catch(console.error);
        } else {
            ysdkInstance = { features: {} };
            updateUIWithLanguage('ru');
        }

        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        let audioCtx = null;

        function initAudio() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!audioCtx && AudioCtx) audioCtx = new AudioCtx();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            } catch(e) {}
        }

        const Sound = {
            play(fn) {
                try {
                    if (audioCtx && audioCtx.state === 'running') fn();
                } catch(e) {}
            },
            click() {
                this.play(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.08);
                });
            },
            hitSoft() {
                this.play(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                });
            },
            hitHard() {
                this.play(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                });
            },
            catHit() {
                this.play(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(450, audioCtx.currentTime + 0.09);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.09);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.09);
                });
            },
            wall() {
                this.play(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                });
            },
            goal() {
                this.play(() => {
                    const now = audioCtx.currentTime;
                    [523.25, 659.25, 783.99].forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                        gain.gain.setValueAtTime(0.25, now + idx * 0.08);
                        gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.08 + 0.12);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.08);
                        osc.stop(now + idx * 0.08 + 0.12);
                    });
                });
            },
            win() {
                this.play(() => {
                    const now = audioCtx.currentTime;
                    [440, 554.37, 659.25, 880].forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                        gain.gain.setValueAtTime(0.3, now + idx * 0.1);
                        gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.1 + 0.25);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.1);
                        osc.stop(now + idx * 0.1 + 0.25);
                    });
                });
            },
            lose() {
                this.play(() => {
                    const now = audioCtx.currentTime;
                    [300, 260, 200, 150].forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                        gain.gain.setValueAtTime(0.2, now + idx * 0.12);
                        gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.12 + 0.15);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.12);
                        osc.stop(now + idx * 0.12 + 0.15);
                    });
                });
            }
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');

        function resizeCanvas() {
            canvas.width = container.clientWidth || window.innerWidth;
            canvas.height = container.clientHeight || window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const skins = [
            { id: 'default', title: '🐱 Обычный котик', src: 'https://i.ibb.co/Q3HJN1Nm/Gemini-Generated-Image-h7tiw0h7tiw0h7ti.jpg' },
            { id: 'pirate',  title: '🏴‍☠️ Кот-Пират',   src: 'https://i.ibb.co/1GpS2R9p/image.png' },
            { id: 'police',  title: '👮 Кот-Коп',     src: 'https://i.ibb.co/gMTP4H22/image-2cc2cc.jpg' }
        ];

        const STORAGE_KEYS = { skin: 'tennisCat_selectedSkin', best: 'tennisCat_bestScore' };

        function loadSavedSkin() {
            try {
                return localStorage.getItem(STORAGE_KEYS.skin) || 'default';
            } catch (e) { return 'default'; }
        }

        function saveSkin(skinId) {
            try { localStorage.setItem(STORAGE_KEYS.skin, skinId); } catch (e) {}
        }

        function loadBestScore() {
            try {
                return parseInt(localStorage.getItem(STORAGE_KEYS.best), 10) || 0;
            } catch (e) { return 0; }
        }

        function saveBestScoreIfHigher(value) {
            const current = loadBestScore();
            if (value > current) {
                try { localStorage.setItem(STORAGE_KEYS.best, String(value)); } catch (e) {}
            }
            updateBestScoreDisplay();
        }

        function updateBestScoreDisplay() {
            const el = document.getElementById('best-score-value');
            if (el) el.innerText = loadBestScore();
        }

        let selectedSkinId = loadSavedSkin();
        let currentSkinIndex = Math.max(0, skins.findIndex(s => s.id === selectedSkinId));

        // Встроенная векторная текстура игрового поля (без вызовов сторонних серверов)
        const bgCanvas = document.createElement('canvas');
        bgCanvas.width = 1024;
        bgCanvas.height = 576;
        const bgCtx = bgCanvas.getContext('2d');

        // Отрисовка интерьера и стола
        bgCtx.fillStyle = '#f2e8cf';
        bgCtx.fillRect(0, 0, 1024, 300);
        bgCtx.fillStyle = '#bc6c25';
        bgCtx.fillRect(0, 300, 1024, 276);

        // Синяя стена с матами
        bgCtx.fillStyle = '#2a9d8f';
        bgCtx.fillRect(0, 180, 1024, 120);

        // Теннисный стол
        bgCtx.beginPath();
        bgCtx.moveTo(200, 576);
        bgCtx.lineTo(824, 576);
        bgCtx.lineTo(700, 320);
        bgCtx.lineTo(324, 320);
        bgCtx.closePath();
        bgCtx.fillStyle = '#0077b6';
        bgCtx.fill();
        bgCtx.lineWidth = 8;
        bgCtx.strokeStyle = '#ffffff';
        bgCtx.stroke();

        // Разметка стола
        bgCtx.beginPath();
        bgCtx.moveTo(512, 320);
        bgCtx.lineTo(512, 576);
        bgCtx.lineWidth = 4;
        bgCtx.strokeStyle = '#ffffff';
        bgCtx.stroke();

        // Сетка
        bgCtx.beginPath();
        bgCtx.moveTo(300, 420);
        bgCtx.lineTo(724, 420);
        bgCtx.lineWidth = 6;
        bgCtx.strokeStyle = '#e0e0e0';
        bgCtx.stroke();

        const bgDataUrl = bgCanvas.toDataURL();

        const URLS = {
            bg: bgDataUrl,
            racket: 'https://i.ibb.co/Gf785Xkq/image.png'
        };

        const sprites = {};
        const cleanedDataUrls = {};

        function assetLoadStarted() {
            pendingAssets++;
        }

        function assetLoadFinished() {
            pendingAssets--;
            if (pendingAssets <= 0) {
                assetsAreReady = true;
                reportGameReadyIfPossible();
            }
        }

        function getTransparentImage(imgUrl, callback) {
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = () => {
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = img.width;
                tempCanvas.height = img.height;
                tempCtx.drawImage(img, 0, 0);

                try {
                    const imgData = tempCtx.getImageData(0, 0, img.width, img.height);
                    const data = imgData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i], g = data[i+1], b = data[i+2];
                        if (r > 200 && g > 200 && b > 200) {
                            data[i + 3] = 0;
                        }
                    }
                    tempCtx.putImageData(imgData, 0, 0);
                    const finalDataUrl = tempCanvas.toDataURL();
                    const cleanImg = new Image();
                    cleanImg.src = finalDataUrl;
                    callback(cleanImg, finalDataUrl);
                } catch (e) {
                    callback(img, imgUrl);
                }
                assetLoadFinished();
            };
            img.onerror = () => {
                callback(img, imgUrl);
                assetLoadFinished();
            };
            img.src = imgUrl;
        }

        assetLoadStarted();
        sprites.bg = new Image();
        sprites.bg.onload = assetLoadFinished;
        sprites.bg.onerror = assetLoadFinished;
        sprites.bg.src = URLS.bg;

        assetLoadStarted();
        getTransparentImage(URLS.racket, (cleanImg) => {
            sprites.racket = cleanImg;
        });

        skins.forEach(skin => {
            assetLoadStarted();
            getTransparentImage(skin.src, (cleanImg, dataUrl) => {
                sprites[skin.id] = cleanImg;
                cleanedDataUrls[skin.id] = dataUrl;
                if (skins[currentSkinIndex].id === skin.id) {
                    updateCarousel();
                }
            });
        });

        const DIFFICULTY_SETTINGS = {
            'easy':   { baseSpeed: 5, catSize: 130, catSpeed: 0.08, missChance: 0.35, attackPower: 1.0, aimAccuracy: 0.2 },
            'medium': { baseSpeed: 7, catSize: 135, catSpeed: 0.15, missChance: 0.18, attackPower: 1.2, aimAccuracy: 0.5 },
            'hard':   { baseSpeed: 9, catSize: 140, catSpeed: 0.25, missChance: 0.08, attackPower: 1.5, aimAccuracy: 0.8 },
            'boss':   { baseSpeed: 11, catSize: 155, catSpeed: 0.40, missChance: 0.02, attackPower: 1.8, aimAccuracy: 0.95 }
        };

        let currentDiff = 'easy';

        function getSettings() {
            return DIFFICULTY_SETTINGS[currentDiff] || DIFFICULTY_SETTINGS['easy'];
        }

        const WIN_SCORE = 5;
        let playerScore = 0;
        let catScore = 0;
        let isPlaying = false;
        let isDragging = false;
        let isResetting = false;
        let catTargetX = 0;
        let approachResolved = true;

        let bgScale = 1;
        let bgOffsetX = 0;
        let bgOffsetY = 0;
        let bgDrawW = 0;
        let bgDrawH = 0;

        const ball = { 
            x: 0, y: 0,
            vx: 0, vy: 0,
            baseRadius: 16, currentRadius: 16,
            progress: 0,
            scaleX: 1, scaleY: 1
        };

        const cat = { x: 0, y: 0, width: 130, height: 130 };
        const racket = { 
            x: 0, y: 0, 
            prevX: 0, prevY: 0,
            vx: 0, vy: 0,
            width: 90, height: 110 
        };

        function resetGame() {
            const settings = getSettings();
            
            cat.width = settings.catSize * bgScale;
            cat.height = settings.catSize * bgScale;

            cat.x = bgOffsetX + bgDrawW / 2;
            cat.y = bgOffsetY + bgDrawH * 0.45;
            catTargetX = cat.x;

            racket.width = 90 * bgScale;
            racket.height = 110 * bgScale;
            racket.x = bgOffsetX + bgDrawW / 2;
            racket.y = bgOffsetY + bgDrawH * 0.82;
            racket.prevX = racket.x;
            racket.prevY = racket.y;
            racket.vx = 0;
            racket.vy = 0;

            isResetting = false;
            serveBall(Math.random() > 0.5 ? 'player' : 'cat');
        }

        function updateHUD() {
            document.getElementById('player-score').innerText = playerScore;
            document.getElementById('cat-score').innerText = catScore;
        }

        function resetBallToLoser(loser) {
            isResetting = true;
            ball.vx = 0;
            ball.vy = 0;
            ball.scaleX = 1;
            ball.scaleY = 1;

            ball.x = bgOffsetX + bgDrawW / 2;
            ball.y = bgOffsetY + bgDrawH / 2;

            let targetX = 0;
            let targetY = 0;

            if (loser === 'player') {
                targetX = racket.x;
                targetY = racket.y - 30 * bgScale;
            } else {
                targetX = cat.x;
                targetY = cat.y + 20 * bgScale;
            }

            const duration = 1200;
            const startX = ball.x;
            const startY = ball.y;
            const startTime = performance.now();

            function animatePass(now) {
                if (!isPlaying) return;

                const elapsed = now - startTime;
                const progress = Math.min(1, elapsed / duration);
                const ease = progress * progress * (3 - 2 * progress);

                const currentTargetX = (loser === 'cat') ? cat.x : targetX;

                ball.x = startX + (currentTargetX - startX) * ease;
                ball.y = startY + (targetY - startY) * ease;

                if (progress < 1) {
                    requestAnimationFrame(animatePass);
                } else {
                    isResetting = false;
                    serveBall(loser);
                }
            }

            requestAnimationFrame(animatePass);
        }

        function serveBall(server) {
            const settings = getSettings();
            ball.scaleX = 1;
            ball.scaleY = 1;

            if (server === 'cat') {
                approachResolved = true;
                ball.x = cat.x;
                ball.y = cat.y + 20 * bgScale;
                
                const targetCorner = racket.x > (bgOffsetX + bgDrawW / 2) ? (bgOffsetX + bgDrawW * 0.2) : (bgOffsetX + bgDrawW * 0.8);
                const dx = targetCorner - ball.x;
                ball.vx = (dx / bgDrawW) * (5 * settings.attackPower * bgScale);
                ball.vy = settings.baseSpeed * bgScale;
            } else {
                approachResolved = false;
                ball.x = racket.x;
                ball.y = racket.y - 30 * bgScale;
                ball.vx = (Math.random() - 0.5) * 4 * bgScale;
                ball.vy = -settings.baseSpeed * bgScale;
            }
        }

        function updateRacketPosition(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            racket.prevX = racket.x;
            racket.prevY = racket.y;

            let targetX = clientX - rect.left;
            let targetY = clientY - rect.top;

            targetX = Math.max(bgOffsetX + racket.width/2, Math.min(bgOffsetX + bgDrawW - racket.width/2, targetX));

            const netLimitY = bgOffsetY + bgDrawH * 0.52;
            const bottomLimitY = bgOffsetY + bgDrawH - racket.height/2;

            if (targetY < netLimitY) targetY = netLimitY;
            if (targetY > bottomLimitY) targetY = bottomLimitY;

            racket.x = targetX;
            racket.y = targetY;

            racket.vx = racket.x - racket.prevX;
            racket.vy = racket.y - racket.prevY;
        }

        container.addEventListener('pointerdown', (e) => {
            initAudio();
            if (!isPlaying) return;
            if (e.target.closest('.ui-screen:not(.hidden)')) return;
            isDragging = true;
            updateRacketPosition(e);
        });

        container.addEventListener('pointermove', (e) => {
            if (isPlaying && isDragging) updateRacketPosition(e);
        });

        container.addEventListener('pointerup', () => isDragging = false);
        container.addEventListener('pointercancel', () => isDragging = false);

        function updateCatAI(settings) {
            if (ball.vy < 0) {
                let predictedX = ball.x;
                let tempY = ball.y;
                let tempVx = ball.vx;

                while (tempY > cat.y + 20 * bgScale) {
                    tempY += ball.vy;
                    predictedX += tempVx;
                    if (predictedX < bgOffsetX + 10 || predictedX > bgOffsetX + bgDrawW - 10) {
                        tempVx *= -1;
                    }
                }

                let attackOffset = 0;
                if (Math.random() < settings.aimAccuracy) {
                    const oppositeSide = racket.x > (bgOffsetX + bgDrawW / 2) ? -35 * bgScale : 35 * bgScale;
                    attackOffset = oppositeSide;
                }

                catTargetX = predictedX + attackOffset;
            } else {
                catTargetX = bgOffsetX + bgDrawW / 2;
            }

            cat.x += (catTargetX - cat.x) * settings.catSpeed;
            cat.x = Math.max(bgOffsetX + cat.width / 3, Math.min(bgOffsetX + bgDrawW - cat.width / 3, cat.x));
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (sprites.bg && sprites.bg.complete && sprites.bg.naturalWidth > 0) {
                const imgRatio = sprites.bg.naturalWidth / sprites.bg.naturalHeight;
                const canvasRatio = canvas.width / canvas.height;

                if (canvasRatio > imgRatio) {
                    bgDrawH = canvas.height;
                    bgDrawW = canvas.height * imgRatio;
                } else {
                    bgDrawW = canvas.width;
                    bgDrawH = canvas.width / imgRatio;
                }

                bgScale = bgDrawH / sprites.bg.naturalHeight;
                bgOffsetX = (canvas.width - bgDrawW) / 2;
                bgOffsetY = (canvas.height - bgDrawH) / 2;

                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(sprites.bg, bgOffsetX, bgOffsetY, bgDrawW, bgDrawH);
            }

            if (isPlaying) {
                const settings = getSettings();

                updateCatAI(settings);

                if (!isResetting) {
                    ball.x += ball.vx;
                    ball.y += ball.vy;

                    ball.scaleX += (1 - ball.scaleX) * 0.15;
                    ball.scaleY += (1 - ball.scaleY) * 0.15;

                    const startY = cat.y + 20 * bgScale;
                    const endY = bgOffsetY + bgDrawH * 0.82;
                    ball.progress = Math.max(0, Math.min(1, (ball.y - startY) / (endY - startY)));
                    ball.currentRadius = ball.baseRadius * bgScale * (0.6 + ball.progress * 0.6);

                    if (ball.x - ball.currentRadius < bgOffsetX + 10 || ball.x + ball.currentRadius > bgOffsetX + bgDrawW - 10) {
                        ball.vx *= -1;
                        if (Math.abs(ball.vx) < 2 * bgScale) {
                            ball.vx = (ball.x < bgOffsetX + bgDrawW / 2 ? 1 : -1) * 3 * bgScale;
                        }
                        ball.scaleX = 0.7;
                        Sound.wall();
                    }

                    if (ball.vy < 0 && ball.y <= cat.y + 35 * bgScale) {
                        const distToCat = Math.abs(ball.x - cat.x);

                        if (!approachResolved && distToCat < cat.width * 0.6) {
                            approachResolved = true;
                            
                            if (Math.random() >= settings.missChance) {
                                let attackDirection = (ball.x - cat.x) / (cat.width / 2);
                                
                                if (Math.random() < settings.aimAccuracy) {
                                    const playerIsLeft = racket.x < (bgOffsetX + bgDrawW / 2);
                                    attackDirection = playerIsLeft ? 0.85 : -0.85;
                                }

                                ball.vy = (settings.baseSpeed + Math.random() * 2) * settings.attackPower * bgScale;
                                ball.vx = attackDirection * (6 + settings.attackPower * 2) * bgScale;
                                ball.scaleY = 0.5;
                                Sound.catHit();
                            }
                        }

                        if (ball.vy < 0 && ball.y <= cat.y - 25 * bgScale) {
                            playerScore++;
                            updateHUD();
                            Sound.goal();
                            
                            if (playerScore >= WIN_SCORE) {
                                gameWin();
                            } else {
                                resetBallToLoser('cat');
                            }
                        }
                    }

                    const distToRacket = Math.hypot(ball.x - racket.x, ball.y - racket.y);
                    if (ball.vy > 0 && distToRacket < (racket.width / 2 + ball.currentRadius)) {
                        const swingSpeed = Math.hypot(racket.vx, racket.vy);
                        const hitPoint = (ball.x - racket.x) / (racket.width / 2);

                        approachResolved = false;

                        if (swingSpeed > 5 * bgScale) {
                            ball.vy = -Math.min(20 * bgScale, (settings.baseSpeed + swingSpeed * 0.6) * bgScale);
                            ball.vx = hitPoint * 7 * bgScale + racket.vx * 0.4;
                            ball.scaleY = 0.4;
                            Sound.hitHard();
                        } else {
                            ball.vy = -Math.max(4 * bgScale, settings.baseSpeed * 0.7 * bgScale);
                            ball.vx = hitPoint * 4 * bgScale;
                            ball.scaleY = 0.8;
                            Sound.hitSoft();
                        }
                    }

                    if (ball.y > bgOffsetY + bgDrawH + 40 * bgScale) {
                        catScore++;
                        updateHUD();
                        Sound.lose();

                        if (catScore >= WIN_SCORE) {
                            gameOver();
                        } else {
                            resetBallToLoser('player');
                        }
                    }
                } else {
                    const startY = cat.y + 20 * bgScale;
                    const endY = bgOffsetY + bgDrawH * 0.82;
                    ball.progress = Math.max(0, Math.min(1, (ball.y - startY) / (endY - startY)));
                    ball.currentRadius = ball.baseRadius * bgScale * (0.6 + ball.progress * 0.6);
                }
            }

            ctx.save();
            ctx.translate(cat.x, cat.y);

            let activeSprite = sprites[selectedSkinId];

            if (activeSprite && activeSprite.complete && activeSprite.naturalWidth > 0) {
                ctx.drawImage(activeSprite, -cat.width / 2, -cat.height / 2, cat.width, cat.height);
            } else {
                ctx.beginPath();
                ctx.arc(0, 0, 40 * bgScale, 0, Math.PI * 2);
                ctx.fillStyle = '#ff9800';
                ctx.fill();
            }
            ctx.restore();

            if (isPlaying) {
                const arcY = Math.sin(ball.progress * Math.PI) * 35 * bgScale;
                
                ctx.save();
                ctx.beginPath();
                ctx.ellipse(ball.x, ball.y, ball.currentRadius, ball.currentRadius * 0.5, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.fill();

                ctx.translate(ball.x, ball.y - arcY);
                ctx.scale(ball.scaleX, ball.scaleY);
                ctx.beginPath();
                ctx.arc(0, 0, ball.currentRadius, 0, Math.PI * 2);
                ctx.fillStyle = currentDiff === 'boss' ? '#ff1744' : '#ccff00';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000';
                ctx.stroke();
                ctx.restore();
            }

            ctx.save();
            ctx.translate(racket.x, racket.y);
            if (sprites.racket && sprites.racket.complete && sprites.racket.naturalWidth > 0) {
                ctx.drawImage(sprites.racket, -racket.width / 2, -racket.height / 2, racket.width, racket.height);
            } else {
                ctx.fillStyle = '#e91e63';
                ctx.fillRect(-racket.width / 2, -10 * bgScale, racket.width, 20 * bgScale);
            }
            ctx.restore();

            requestAnimationFrame(gameLoop);
        }

        function updateCarousel() {
            const skin = skins[currentSkinIndex];
            const imgElem = document.getElementById('skin-preview-img');
            const langData = TRANSLATIONS[currentLang] || TRANSLATIONS['en'];
            
            imgElem.src = cleanedDataUrls[skin.id] || skin.src;
            document.getElementById('skin-title-text').innerText = skin.title;

            const selectBtn = document.getElementById('btn-select-skin');
            if (skin.id === selectedSkinId) {
                selectBtn.innerText = langData.btnSelected || 'ВЫБРАНО';
                selectBtn.style.background = '#8bc34a';
            } else {
                selectBtn.innerText = langData.btnSelect || 'ВЫБРАТЬ';
                selectBtn.style.background = '#4caf50';
            }
        }

        document.getElementById('btn-prev-skin').onclick = function() {
            currentSkinIndex = (currentSkinIndex - 1 + skins.length) % skins.length;
            updateCarousel();
        };

        document.getElementById('btn-next-skin').onclick = function() {
            currentSkinIndex = (currentSkinIndex + 1) % skins.length;
            updateCarousel();
        };

        document.getElementById('btn-select-skin').onclick = function() {
            selectedSkinId = skins[currentSkinIndex].id;
            saveSkin(selectedSkinId);
            updateCarousel();
        };

        function startGame(targetDiff) {
            if (targetDiff && DIFFICULTY_SETTINGS[targetDiff]) {
                currentDiff = targetDiff;
            }
            
            playerScore = 0;
            catScore = 0;
            updateHUD();

            resetGame();
            isPlaying = true;
            
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('difficulty-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('win-screen').classList.add('hidden');
            document.getElementById('inventory-screen').classList.add('hidden');
            
            document.getElementById('hud').classList.remove('hidden');
        }

        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                initAudio();
                Sound.click();
            });
        });

        document.getElementById('btn-start').onclick = function() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('difficulty-screen').classList.remove('hidden');
        };

        document.getElementById('btn-diff-back').onclick = function() {
            document.getElementById('difficulty-screen').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        };

        document.querySelectorAll('#difficulty-screen .btn[data-diff]').forEach(btn => {
            btn.addEventListener('click', function() {
                const diff = this.getAttribute('data-diff');
                startGame(diff);
            });
        });

        document.getElementById('btn-restart').onclick = function() { startGame(); };
        document.getElementById('btn-win-restart').onclick = function() { startGame(); };

        document.getElementById('btn-next-level').onclick = function() {
            const nextMap = {
                'easy': 'medium',
                'medium': 'hard',
                'hard': 'boss'
            };
            const target = nextMap[currentDiff] || 'easy';
            startGame(target);
        };

        document.getElementById('btn-gameover-diff').onclick = function() {
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('difficulty-screen').classList.remove('hidden');
        };

        document.getElementById('btn-win-menu').onclick = function() {
            document.getElementById('win-screen').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        };

        function openInventory() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('inventory-screen').classList.remove('hidden');
            updateCarousel();
        }

        document.getElementById('btn-inventory').onclick = openInventory;
        document.getElementById('btn-gameover-inventory').onclick = openInventory;

        document.getElementById('btn-back').onclick = function() {
            document.getElementById('inventory-screen').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        };

        function gameOver() {
            isPlaying = false;
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('final-score').innerText = `${playerScore} : ${catScore}`;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        function gameWin() {
            isPlaying = false;
            Sound.win();
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('win-score-text').innerText = `${playerScore} : ${catScore}`;
            
            const btnNext = document.getElementById('btn-next-level');
            if (currentDiff === 'boss') {
                btnNext.classList.add('hidden');
            } else {
                btnNext.classList.remove('hidden');
            }

            document.getElementById('win-screen').classList.remove('hidden');
            saveBestScoreIfHigher(playerScore);
        }

        updateBestScoreDisplay();
        gameLoop();
    </script>
</body>
</html>
